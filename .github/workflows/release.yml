name: Release

# Publishing is a tag, so what is on npm is always something somebody decided to release rather
# than something a merge did on its way past.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # prepack cleans and builds, so what is packed is what this commit compiles to.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
